[project]
name = "contexthaus-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.5.0",
    "tavily-python>=0.3.9",
    "sqlalchemy>=2.0.30",
    "greenlet>=3.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "pypdf>=4.2.0",
    "pydantic>=2.7.0",
    "gliner>=0.2.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.8.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
